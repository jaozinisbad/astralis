# Serviço web e gratuito; PostgreSQL persistente fica no Neon.
services:
  - type: web
    name: app-gamers-server
    runtime: node
    plan: free
    rootDir: server
    buildFilter:
      paths:
        - server/**
        - render.yaml
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
