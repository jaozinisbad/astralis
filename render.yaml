# Serviço web e gratuito; PostgreSQL persistente fica no Neon.
services:
  - type: web
    name: app-gamers-server
    runtime: rust
    plan: free
    buildFilter:
      paths:
        - server-rust/**
        - render.yaml
    buildCommand: rustup toolchain install 1.100.0 --profile minimal && cargo +1.100.0 build --manifest-path server-rust/Cargo.toml --release --locked
    startCommand: ./server-rust/target/release/astralis-server
    healthCheckPath: /health
    envVars:
      - key: RUSTUP_TOOLCHAIN
        value: "1.100.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
