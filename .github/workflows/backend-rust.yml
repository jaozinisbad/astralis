name: Backend Rust

on:
  push:
    branches: [master, 'codex/astralis-rust-backend']
    paths: ['server-rust/**', 'server/**', '.github/workflows/backend-rust.yml']
  pull_request:
    paths: ['server-rust/**', 'server/**', '.github/workflows/backend-rust.yml']

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astralis_test
          POSTGRES_PASSWORD: astralis_test
          POSTGRES_DB: astralis_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astralis_test -d astralis_rust_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: npm ci --ignore-scripts --prefix client
      - run: npm ci --ignore-scripts --prefix server
      - run: cargo +1.100.0 test --release --locked --manifest-path server-rust/Cargo.toml
      - run: cargo +1.100.0 build --release --locked --manifest-path server-rust/Cargo.toml
      - run: node server-rust/compare.cjs
        env:
          ASTRALIS_TEST_DATABASE_URL: postgresql://astralis_test:astralis_test@127.0.0.1:5432/astralis_rust_test
